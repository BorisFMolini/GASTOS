<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos</title>
  <meta name="theme-color" content="#0F172A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { height: 100%; margin: 0; background: #0F172A; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0F172A; }
  </style>
</head>
<body>
  <iframe id="app" title="Gastos"></iframe>
  <script>
    // 1) Pegá acá la URL de tu web app (termina en /exec)
    var URL_APP = 'https://script.google.com/macros/s/AKfycbxYUVF_opXLtzkT5j_Z6xAVTHbH1kCXHaGU28vX4qAPpm49ntFeIjlgFA-y96fjp4tqOg/exec';
    // 2) 'iframe' = se ve como app propia. Si no carga o te pide login, cambialo a 'redirect'.
    var MODO = 'iframe';

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    if (MODO === 'redirect') location.replace(URL_APP);
    else document.getElementById('app').src = URL_APP;
  </script>
</body>
</html>
